version: "2"
sql:
  - name: main
    schema: ./internal/db/migrations/*.sql
    queries: ./internal/db/queries/*.sql
    engine: postgresql
    database:
      uri: "${DB_CLIENT}://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}"
      # pg_dump --schema-only --host=${DB_HOST} --port=${DB_PORT} --username="${DB_USER}:${DB_PASSWORD}" ${DB_DATABASE}
    gen:
      go:
        overrides:
          - db_type: "geometry"
            go_type: "github.com/cridenour/go-postgis.Point"
          - db_type: "public.geometry"
            go_type: "github.com/cridenour/go-postgis.Point"
        package: db
        sql_package: "pgx/v5"
        out: ./internal/db
        emit_json_tags: true
        emit_interface: false
        json_tags_id_uppercase: false
        emit_db_tags: true
        emit_exported_queries: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: false
        emit_enum_valid_method: false
        query_parameter_limit: 0
